server {
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Security headers (incl. the CSP) are in security-headers.conf, included per location because a location
	# with its own add_header does not inherit the server-level ones.

	location /_app/immutable/ {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	location / {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "no-cache" always;
		try_files $uri $uri/ /index.html;
	}
}
