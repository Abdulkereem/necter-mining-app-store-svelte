server {
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;
	add_header X-Frame-Options DENY always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	# API calls go to the Hub only; WalletConnect relay/verify when enabled.
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://testnet-rpc.necter.network; font-src 'self' data:; connect-src 'self' https://testnet-rpc.necter.network wss://relay.walletconnect.com wss://relay.walletconnect.org https://verify.walletconnect.com https://verify.walletconnect.org https://rpc.walletconnect.com https://ethereum-sepolia-rpc.publicnode.com; frame-src https://verify.walletconnect.com https://verify.walletconnect.org; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ /index.html;
	}
}
