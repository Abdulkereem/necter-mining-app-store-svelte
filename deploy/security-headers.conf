# Security headers for every response of the web store (included in each location: nginx drops server-level
# add_header directives in any location that sets its own, e.g. Cache-Control).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Same policy as the miner serves with the local build (PLATFORM.md errata E8), for the web origin: no inline
# scripts (the boot script is a file), self-hosted fonts, API calls to the Hub only, WalletConnect when enabled.
# From deploy/csp.mjs webCsp(); src/lib/csp.test.ts keeps the two in sync. Another Hub host needs a new policy.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://testnet-rpc.necter.network wss://testnet-rpc.necter.network wss://relay.walletconnect.com wss://relay.walletconnect.org https://rpc.walletconnect.com https://rpc.walletconnect.org https://verify.walletconnect.com https://verify.walletconnect.org https://ethereum-sepolia-rpc.publicnode.com; frame-src https://verify.walletconnect.com https://verify.walletconnect.org; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
